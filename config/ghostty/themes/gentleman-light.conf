# Gentleman Light - custom Ghostty theme
# Colorblind-friendly, high-contrast light companion for gentleman-dark.conf.
# Tuned for deuteranomaly/deuteranopia:
# - Avoids relying on red vs green alone.
# - Uses blue, teal, orange/brown, purple, and vermillion with distinct luminance.
# - Yellow is dark amber/brown for contrast on a white background.
# Inspired by colorblind-safe palettes such as Okabe-Ito, adapted for terminal ANSI colors.

