# =========================================
# Tmux configuration tuned for Ghostty
# Rounded tabs v6 - safe icons
# =========================================

set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY PATH"

# -------------------------
# Terminal / colors
# -------------------------

# Use a modern tmux terminfo entry and enable true color support.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Add Ghostty-specific terminal features.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:extkeys"

# Sync clipboard with the system clipboard.
set -g set-clipboard external

# -------------------------
# Window title / terminal title
# -------------------------

# Let tmux update the terminal title shown by Ghostty/macOS.
set -g set-titles on
set -g set-titles-string "#{session_name} • #{b:pane_current_path}"

# -------------------------
# Prefix / indexing
# -------------------------

# Use Ctrl-a as the tmux prefix instead of the default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at index 1.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically after closing one.
set -g renumber-windows on

# -------------------------
# General behavior
# -------------------------

# Enable mouse support for pane selection, resize, and scrolling.
set -g mouse on

# Keep a longer scrollback history.
set -g history-limit 50000

# Improve responsiveness for vim/neovim and escape sequences.
set -sg escape-time 0

# Enable focus reporting for better editor integration.
set -g focus-events on

# Use vi-style keys in copy mode.
setw -g mode-keys vi

# -------------------------
# Status line / top tabs
# -------------------------

# Show the status line at the top to resemble Ghostty tabs.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 1
set -g status-right-length 90

# Slightly lighter than the terminal background for visual separation.
set -g status-style "bg=#121a27,fg=#aeb7d0"

# Keep the left side empty for a cleaner, more native look.
set -g status-left ""

# Right side: current folder, git branch, RAM usage, and time.
set -g status-right "#[fg=#9aa5ce,bg=#121a27]#{b:pane_current_path} #[fg=#42506a,bg=#121a27]· #[fg=#b7cc85,bg=#121a27]#(~/.config/tmux/scripts/git_branch.sh '#{pane_current_path}') #[fg=#42506a,bg=#121a27]· #[fg=#a8dcff,bg=#121a27]#(~/.config/tmux/scripts/ram_usage.sh) #[fg=#42506a,bg=#121a27]· #[fg=#f3f6f9,bg=#121a27,bold]%H:%M "

# Remove spacing/separators between window tabs.
setw -g window-status-separator ""

# Do not let tmux auto-generate window names.
setw -g automatic-rename off
set -g allow-rename off

# Inactive tab style.
setw -g window-status-format "#[fg=#121a27,bg=#121a27]#[fg=#c7cfdf,bg=#202a3b]  #(~/.config/tmux/scripts/window_icon.sh '#{window_id}') #W  #[fg=#202a3b,bg=#121a27] "

# Active tab style.
setw -g window-status-current-format "#[fg=#121a27,bg=#121a27]#[fg=#071018,bg=#a8dcff,bold]  #(~/.config/tmux/scripts/window_icon.sh '#{window_id}') #W  #[fg=#a8dcff,bg=#121a27] "

# Highlight windows with activity, bell events, or when they were last active.
setw -g window-status-activity-style "fg=#071018,bg=#f5dd7b,bold"
setw -g window-status-bell-style "fg=#071018,bg=#f38ba8,bold"
setw -g window-status-last-style "fg=#f3f6f9,bg=#334155"

# -------------------------
# Activity monitoring
# -------------------------

# Highlight windows that receive output while unfocused.
setw -g monitor-activity on
set -g visual-activity off
set -g activity-action other

# -------------------------
# Pane borders / pane header
# -------------------------

# Use a more defined border style and highlight the active pane.
set -g pane-border-lines single
set -g pane-border-indicators both
set -g pane-border-style "fg=#2b364a"
set -g pane-active-border-style "fg=#8bd5ff"

# Show a small header above each pane with index and current command.
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# -------------------------
# Messages / prompts
# -------------------------

# Style for tmux messages and command prompts.
set -g message-style "fg=#f3f6f9,bg=#263245"
set -g message-command-style "fg=#071018,bg=#f5dd7b,bold"

# -------------------------
# Copy mode
# -------------------------

# Vi-style text selection and yank in copy mode.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# -------------------------
# Config management
# -------------------------

# Reload tmux config quickly.
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Open the tmux config in the editor, then reload it on save/exit.
bind-key e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-nvim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# -------------------------
# Pane management
# -------------------------

# Split panes and inherit the current working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation with prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes quickly with Alt + arrow keys.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + arrow keys.
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10

# Zoom/focus current pane (toggle fullscreen).
bind z resize-pane -Z

# Toggle synchronized input across panes.
bind-key S setw synchronize-panes

# -------------------------
# Window management
# -------------------------

# Navigate windows.
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind p previous-window
bind n next-window
bind Tab last-window

# Create new windows in the current pane's directory.
bind c new-window -c "#{pane_current_path}"

# Rename the current window.
bind , command-prompt -I "#W" "rename-window '%%'"

# Toggle the status bar.
bind-key t set-option status

# Project picker / sessionizer in a popup
bind-key f display-popup -E -w 70% -h 70% "~/.config/tmux/scripts/tmux-sessionizer.sh"

# Disney project picker / sessionizer in a popup
bind-key d display-popup -E -w 70% -h 70% "~/.config/tmux/scripts/tmux-sessionizer-disney.sh"

# tmux-fzf session actions menu
bind-key F run-shell "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh"

# Show active/open sessions
bind-key s choose-tree -s

# New editor window
bind-key E new-window -n exec -c "#{pane_current_path}"

# New dev window
bind-key D new-window -n claude -c "#{pane_current_path}"

# New git window
bind-key G new-window -n git -c "#{pane_current_path}"

# New tests window
bind-key T new-window -n tests -c "#{pane_current_path}"\

bind-key w run-shell "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh"

# -------------------------
# Plugins
# -------------------------

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session save / restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Clipboard / yank integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Extra pane/window helpers
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'

# Fuzzy finding helpers
set -g @plugin 'sainnhe/tmux-fzf'

# -------------------------
# Plugin configuration
# -------------------------

# Save pane contents with resurrect.
set -g @resurrect-capture-pane-contents 'on'

# Auto-save and auto-restore sessions.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# TPM must stay at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
